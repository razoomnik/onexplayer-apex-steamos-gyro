# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: ONEXPLAYER APEX
single_source: false

matches:
  - dmi_data:
      product_name: ONEXPLAYER APEX
      sys_vendor: ONE-NETBOOK

source_devices:
  # Original Firmware
  - group: gamepad
    evdev:
      name: Microsoft X-Box 360 pad
      phys_path: usb-0000:65:00.4-1.3/input0
      handler: event*

  - group: keyboard
    evdev:
      name: "HID 1a86:fe00"
      phys_path: usb-0000:65:00.4-1.2/input0
      handler: event*

  # Updated Firmware
  - group: gamepad
    evdev:
      name: Microsoft X-Box 360 pad
      phys_path: usb-0000:c5:00.4-1.3/input0
      handler: event*

  - group: keyboard
    evdev:
      name: "HID 1a86:fe00"
      phys_path: usb-0000:c5:00.4-1.2/input0
      handler: event*

  - group: keyboard
    evdev:
      name: AT Translated Set 2 keyboard
      phys_path: isa0060/serio0/input0
      handler: event*

  - group: gamepad
    hidraw:
      vendor_id: 0x1a86
      product_id: 0xfe00
      interface_num: 2

  - group: imu
    iio:
      name: "{i2c-BMI0160:00,bmi260}"
      mount_matrix:
        x: [0.027995, 0.999583, -0.007058]
        y: [0.917322, -0.028495, -0.397126]
        z: [-0.397161, 0.004643, -0.917737]

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - mouse
  - keyboard

capability_map_id: oxp8
